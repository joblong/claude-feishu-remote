# =============================================================================
# Tmux 配置文件 - 整合版（适配 Claude Code + macOS）
# =============================================================================

# ── 前缀键：改为 C-a ──────────────────────────────────────────────────────────
# 默认前缀是 C-b，改为 C-a 更符合主流习惯（参考 screen 风格）
# 注意：C-a 在 bash/zsh 中是"跳到行首"，tmux 内按 C-a C-a 可发送原始 C-a 信号
set -g prefix C-a
unbind C-b
bind C-a send-prefix           # C-a C-a = 向终端发送真实的 C-a（跳到行首）

# ── 鼠标支持（默认开启，可随时切换）─────────────────────────────────────────
# 开启时：tmux 接管鼠标，支持滚轮翻页、点击切换面板、拖拽调整面板大小
# 关闭时：Terminal 原生处理鼠标事件，可直接用鼠标选中文字然后 Cmd+C 复制
set -g mouse on                # ← 默认开启；C-g 可随时切换关闭
bind -n C-g set -g mouse \; display "#{?mouse,[鼠标 ON] 滚轮/面板切换可用，复制用 C-q 或 iTerm2,[鼠标 OFF] 拖拽选中后 Cmd+C 直接复制}"
#  ^ Ctrl+G 一键切换鼠标开/关
#  ^ 鼠标 OFF 时：Terminal.app 原生接管，拖拽选中 + Cmd+C 直接复制（Terminal.app / SSH 均有效）
#  ^ 鼠标 ON  时：tmux 接管滚动/面板切换；复制用 C-q→v→y（需 iTerm2）或再按 C-g 关掉

# ── 响应速度 ──────────────────────────────────────────────────────────────────
set -s escape-time 0           # ESC 键延迟改为 0ms（默认 500ms 会导致 Vim/Claude Code 卡顿）
set -g repeat-time 600         # 方向键连按时间窗口（ms），调大后 hjkl 切面板更顺手
set -g focus-events on         # 让 tmux 内的 vim/neovim 能响应窗口聚焦事件（自动刷新等）

# ── 历史缓冲区 ────────────────────────────────────────────────────────────────
set -g history-limit 50000     # 保留 5 万行历史，防止 Claude Code 长输出被顶掉

# ── 窗口 / 面板编号从 1 开始 ──────────────────────────────────────────────────
set -g base-index 1            # 窗口编号从 1 开始（键盘 1 在左边，0 在右边不顺手）
setw -g pane-base-index 1      # 面板编号也从 1 开始，与窗口保持一致
set -g renumber-windows on     # 关闭窗口后自动重新编号，避免出现空缺（1,3,5 → 1,2,3）

# ── 进入复制/滚动模式 ─────────────────────────────────────────────────────────
bind -n C-q copy-mode          # 直接按 Ctrl+Q 进入复制模式（不需要先按前缀键 C-a）
#  ^ 这是核心快捷键，进入后可以用键盘翻页、搜索、选择文字

# ── 复制模式：Vi 键位 ─────────────────────────────────────────────────────────
setw -g mode-keys vi           # 复制模式使用 vi 键位（h/j/k/l 移动，/ 搜索）
bind-key -T copy-mode-vi v send-keys -X begin-selection
#  ^ 复制模式中按 v 开始选择文字（类似 vim 的 visual mode）
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
#  ^ 按 y 复制并退出复制模式；配合下方 set-clipboard on，tmux 自动用 OSC 52 写剪贴板
#  ^ OSC 52 是终端标准序列，本机和 SSH 远端统一有效，无需 pbcopy
# 注：按 q 直接退出复制模式（不复制，tmux 内置，无需配置）

# 鼠标模式开启时：拖拽选中后自动复制到系统剪贴板
# 注：鼠标开启后 tmux 内置已处理拖拽进入复制模式，无需额外绑定 MouseDrag1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
#  ^ 松开鼠标时自动通过 OSC 52 复制到本地剪贴板，本机/SSH 均有效
# 备注：鼠标模式关闭时，在终端直接用鼠标选中 + Cmd+C 即可（Terminal 原生处理）
# 备注：也可按住 Option 键拖拽选中，Terminal 会绕过 tmux 直接复制（任何模式下均有效）

# ── 颜色 / 真彩色 ─────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"           # 开启 256 色支持
set -ga terminal-overrides ",xterm-256color:Tc"     # 开启真彩色（24-bit），避免 Claude Code 语法高亮颜色失真
set -g set-clipboard on                             # 开启 OSC 52，允许 tmux 通过终端转义序列写本地剪贴板（SSH 场景必须）

# ── 分屏（保留当前工作目录）──────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"    # C-a + | 横向分屏（左右）
bind - split-window -v -c "#{pane_current_path}"    # C-a + - 纵向分屏（上下）
#  ^ #{pane_current_path} 确保新面板继承当前目录，不会跳回 home 目录

# ── 面板切换（Vim 方向键）────────────────────────────────────────────────────
bind h select-pane -L          # C-a + h 切换到左侧面板
bind j select-pane -D          # C-a + j 切换到下方面板
bind k select-pane -U          # C-a + k 切换到上方面板
bind l select-pane -R          # C-a + l 切换到右侧面板

# ── 状态栏 ────────────────────────────────────────────────────────────────────
set -g status-left '[#S] '                          # 左侧显示 session 名称，如 [main]
set -g status-left-length 20                        # 左侧最大宽度 20 字符
set -g status-right '#(test -e ~/.claude/feishu-remote/away-mode && echo "🏃 afk" || echo "💻 tty") #{?mouse,🖱 ON,🖱 OFF} | %Y-%m-%d %H:%M'
#  ^ 右侧常驻显示:afk 模式(C-b 切)| 鼠标模式(C-g 切)| 日期时间
#    🏃afk = 离开模式(飞书审批生效)  /  💻tty = 终端模式
#    🖱ON  = tmux 接管鼠标(滚轮/面板) / 🖱OFF = Terminal 原生(拖拽+Cmd+C)
set -g status-right-length 60                       # 右侧给够宽度放 afk+鼠标+时间
set -g status-interval 5                            # 状态栏每 5 秒刷新一次（默认 15 秒，时间会滞后）
set -g display-time 2000                            # 状态栏提示显示 2 秒（默认 750ms 一闪而过）

# ── 重新加载配置 ──────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "配置已重载"
#  ^ C-a + r 热重载配置，不需要重启 tmux

# ── afk 模式切换（claude-feishu-remote）───────────────────────────────────────
# 原 tmux prefix 是 C-b，改为 C-a 之后 C-b 空置，正好用来切离开/终端模式。
# 不在 tmux 里按不到这个键，天然约束 afk on 只能在 tmux 内开启。
bind -n C-b run-shell ' \
    if [ -e ~/.claude/feishu-remote/away-mode ]; then \
        ~/.local/bin/afk off >/dev/null 2>&1; \
        tmux display "afk: OFF 终端模式"; \
    else \
        ~/.local/bin/afk on >/dev/null 2>&1; \
        tmux display "afk: ON 离开模式（飞书审批已生效）"; \
    fi'
#  ^ Ctrl+B 一键切换（无需 prefix），在 tmux 任何 pane 生效
